<!DOCTYPE html>
<html>
<head>
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Task Manager</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about.html">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/contact.html">Contact Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="settings.html">Settings</a>
                    </li>
                </ul>

            </div>
        </div>
    </nav>


    <div class="container-md mt-5 pt-4 w-75 mx-auto">

        <h1 class="mb-4">Tasks</h1>

        <form class="mb-4" onsubmit="addTask(event)">

            <div class="mb-3">
                <label for="taskName" class="form-label">Task Name</label>

                <div class="w-50">
                    <input type="text"
                           class="form-control"
                           id="taskName"
                           placeholder="Enter task name">

                </div>
            </div>
            <button type="submit" class="btn btn-primary">
                Add Task
            </button>

            <button type="button"
                    onclick="loadTasks()"
                    class="btn btn-info">
                Load Tasks
            </button>

        </form>

        <ul id="taskList" class="list-group"></ul>

    </div>
    <script>
        async function loadTasks() {
            const response = await fetch("/api/tasks");
            const tasks = await response.json();

            const taskList = document.getElementById("taskList");

            taskList.innerHTML = "";

            tasks.forEach(task => {


                const li = document.createElement("li");

                li.dataset.taskID = task.id;

                li.className = "list-group-item d-flex justify-content-between align-items-center";

                const left = document.createElement("div");
                left.className = "d-flex align-items-center gap-2";

                const titleSpan = document.createElement("span");

                titleSpan.textContent = task.title;

                const statusSpan = document.createElement("span");

                statusSpan.textContent = task.isCompleted ? "✅" : "❌";

                const dropdownDiv = document.createElement("div");

                dropdownDiv.className = "dropdown";

                const button = document.createElement("button");

                button.className = "btn btn-sm btn-secondary";
                button.setAttribute("data-bs-toggle", "dropdown");
                button.textContent = "⋮";

                const menu = document.createElement("ul");

                menu.className = "dropdown-menu";

                const deleteItem = document.createElement("li");
                deleteItem.innerHTML =
                    `<a class="dropdown-item text-danger">Delete<a/>`;

                deleteItem.addEventListener("click", async () => {

                    await fetch(`/api/tasks/${task.id}`, {
                        method: "DELETE"
                    });

                    loadTasks();
                });


                const toggleItem = document.createElement("li");
                toggleItem.innerHTML =
                    `<a class="dropdown-item text-secondary">Toggle</a>`;

                toggleItem.addEventListener("click", async () => {

                    await fetch(`/api/tasks/${task.id}`, {
                        method: "PUT",
                        headers:
                        {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            title: task.title,
                            isCompleted: !task.isCompleted
                        })
                    });

                    loadTasks();

                });



                const updateItem = document.createElement("li");
                updateItem.innerHTML =
                    `<a class="dropdown-item text-warning">Update<a/>`;

                updateItem.addEventListener("click", async () => {

                    const newTitle = prompt("New title:");

                    if (!newTitle) { return; }

                    await fetch(`/api/tasks/${task.id}`, {
                        method: "PUT",
                        headers:
                        {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            title: newTitle,
                            isCompleted: task.isCompleted
                        })
                    });

                    loadTasks();

                });

                menu.append(deleteItem);
                menu.append(toggleItem);
                menu.append(updateItem);

                dropdownDiv.append(button);
                dropdownDiv.append(menu);

                left.append(titleSpan);
                left.append(statusSpan);
                
                li.append(left);
                li.append(dropdownDiv);

                taskList.append(li);
            }
            );
        }

        async function addTask(event) {
            event.preventDefault();

            const titleInput = document.getElementById("taskName");

    
            const task = {
                title: titleInput.value,
            };

            const response = await fetch("/api/tasks", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(task)
            });

            if (response.ok) {

                titleInput.value = "";
            }
            loadTasks();
        }


    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
